<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GeminiFolders demo</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #131314;
        color: #e3e3e3;
        font-family: 'Google Sans', 'Helvetica Neue', Arial, sans-serif;
      }
      .app { display: flex; min-height: 100vh; }
      .sidebar { width: 300px; padding: 12px 0 12px 4px; background: #1e1f20; color: #e3e3e3; }
      .item {
        display: flex; align-items: center; gap: 12px;
        height: 36px; margin-right: 4px; padding: 0 16px;
        border-radius: 9999px; font-size: 14px;
      }
      .item svg { width: 20px; height: 20px; fill: currentColor; opacity: 0.85; }
      .section { height: 32px; display: flex; align-items: center; gap: 4px; padding: 0 16px; margin-top: 12px;
        font-size: 13px; color: rgb(255 255 255 / 0.55); }
      .main { flex: 1; display: grid; place-items: center; }
      .main > div { width: min(640px, 80%); }
      .prompt { padding: 18px 24px; border-radius: 28px; background: #1e1f20; color: #9aa0a6; }
      h1 { font-weight: 400; font-size: 32px; text-align: center; margin: 0 0 24px; }
    </style>
  </head>
  <body class="dark-theme">
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="item">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" /></svg>New chat
        </div>
        <div class="item">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" /></svg>Search chats
        </div>
        <div id="panel" style="margin-top: 16px"></div>
        <div class="section">Recent ›</div>
      </aside>
      <main class="main">
        <div>
          <h1>Hello, Alex</h1>
          <div class="prompt">Ask anything</div>
        </div>
      </main>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
